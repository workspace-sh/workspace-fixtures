<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="120" viewBox="0 0 240 120">
<rect width="240" height="120" rx="10" fill="#1f2433"/>
<rect y="92" width="240" height="28" rx="0" fill="#2b3245"/>
<text x="10" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e8ecf4">SMIL: begin offset, fill=freeze</text>
<text x="10" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#9aa6bd">Waits 1 s, slides right over 1 s, then stays there.</text>
<circle cx="30" cy="46" r="14" fill="#c3e88d"><animate attributeName="cx" from="30" to="210" begin="1s" dur="1s" fill="freeze"/></circle>
</svg>
