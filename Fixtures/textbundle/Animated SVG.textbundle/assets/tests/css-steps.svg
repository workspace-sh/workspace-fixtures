<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="120" viewBox="0 0 240 120">
<style>.step{animation:step 2s steps(5) infinite}@keyframes step{to{transform:translateX(175px)}}</style><rect width="240" height="120" rx="10" fill="#1f2433"/>
<rect y="92" width="240" height="28" rx="0" fill="#2b3245"/>
<text x="10" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e8ecf4">CSS: steps() timing</text>
<text x="10" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#9aa6bd">The square jumps across in 5 steps, no glide.</text>
<rect class="step" x="20" y="34" width="24" height="24" fill="#c792ea"/>
</svg>
