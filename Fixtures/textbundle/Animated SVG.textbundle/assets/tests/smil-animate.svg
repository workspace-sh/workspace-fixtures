<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="120" viewBox="0 0 240 120">
<rect width="240" height="120" rx="10" fill="#1f2433"/>
<rect y="92" width="240" height="28" rx="0" fill="#2b3245"/>
<text x="10" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e8ecf4">SMIL &lt;animate&gt;: an attribute (r, cx)</text>
<text x="10" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#9aa6bd">The circle grows and moves right, then repeats.</text>
<circle cx="40" cy="46" r="8" fill="#6ea8fe"><animate attributeName="r" values="8;24;8" dur="2s" repeatCount="indefinite"/><animate attributeName="cx" values="40;200;40" dur="4s" repeatCount="indefinite"/></circle>
</svg>
