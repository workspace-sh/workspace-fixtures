<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="120" viewBox="0 0 240 120">
<rect width="240" height="120" rx="10" fill="#1f2433"/>
<rect y="92" width="240" height="28" rx="0" fill="#2b3245"/>
<text x="10" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e8ecf4">SMIL: calcMode=discrete</text>
<text x="10" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#9aa6bd">The colour changes in hard steps: red, green, blue.</text>
<rect x="90" y="20" width="60" height="52" rx="8" fill="#ff5370"><animate attributeName="fill" values="#ff5370;#c3e88d;#82aaff" calcMode="discrete" dur="3s" repeatCount="indefinite"/></rect>
</svg>
