<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="120" viewBox="0 0 240 120">
<rect width="240" height="120" rx="10" fill="#1f2433"/>
<rect y="92" width="240" height="28" rx="0" fill="#2b3245"/>
<text x="10" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e8ecf4">SMIL &lt;set&gt;: visibility</text>
<text x="10" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#9aa6bd">The text appears 1 s in and stays (fill=freeze).</text>
<text x="120" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#c3e88d" visibility="hidden">Hello<set attributeName="visibility" to="visible" begin="1s" fill="freeze"/></text>
</svg>
