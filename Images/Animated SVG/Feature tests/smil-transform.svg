<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="120" viewBox="0 0 240 120">
<rect width="240" height="120" rx="10" fill="#1f2433"/>
<rect y="92" width="240" height="28" rx="0" fill="#2b3245"/>
<text x="10" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e8ecf4">SMIL &lt;animateTransform&gt;: scale and rotate</text>
<text x="10" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#9aa6bd">The star pulses in size while it turns.</text>
<g transform="translate(120 46)"><g><path d="M0 -26 L7 -8 L26 -8 L11 4 L16 22 L0 11 L-16 22 L-11 4 L-26 -8 L-7 -8 Z" fill="#ffcb6b"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></g><animateTransform attributeName="transform" type="scale" values="1;1.4;1" dur="1s" additive="sum" repeatCount="indefinite"/></g>
</svg>
