<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="120" viewBox="0 0 240 120">
<style>.pulse{animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{opacity:.1}}</style><rect width="240" height="120" rx="10" fill="#1f2433"/>
<rect y="92" width="240" height="28" rx="0" fill="#2b3245"/>
<text x="10" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e8ecf4">CSS @keyframes: opacity</text>
<text x="10" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#9aa6bd">The dot fades out and back every 1.5 s.</text>
<circle class="pulse" cx="120" cy="46" r="22" fill="#f78c6c"/>
</svg>
